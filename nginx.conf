# apps/wpda/nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets com hash no nome podem ser cacheados para sempre; o index.html não,
  # senão um deploy novo continua servindo o bundle velho.
  location /wpda/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /wpda/index.html {
    add_header Cache-Control "no-cache";
  }

  # Rota de SPA: qualquer caminho sob /wpda/ cai no index.
  location /wpda/ {
    try_files $uri $uri/ /wpda/index.html;
  }

  location = /up {
    access_log off;
    return 200 "ok";
  }

  # Fallthrough explícito: qualquer coisa fora de /wpda/ e /up (inclusive /)
  # 404, nunca a página padrão do nginx.
  location / {
    return 404;
  }
}
